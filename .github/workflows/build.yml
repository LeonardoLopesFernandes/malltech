name: Build Android APK (arm64-v8a)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (arm64-v8a, split-per-abi)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          KEYSTORE_PASSWORD: malltech123
          KEY_ALIAS: malltech
          KEY_PASSWORD: malltech123

      - name: Prepare artifact
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk malltech-arm64-v8a-release.apk

      - name: Notas da release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force
          atual="${GITHUB_REF#refs/tags/}"
          anterior=$(git tag --sort=-v:refname | grep '^v' | sed -n 2p)
          {
            echo 'O que melhorou:';
            echo '';
            if [ -n "$anterior" ]; then
              git log "$anterior..$atual" --pretty=format:'- %s'
              echo '';
              echo '';
              echo "**Full Changelog**: $anterior...$atual";
            else
              git log -10 --pretty=format:'- %s';
            fi
          } > /tmp/notas.txt
          cat /tmp/notas.txt

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: malltech-arm64-v8a-release.apk
          body_path: /tmp/notas.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Manter somente as duas últimas tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force
          antigas=$(git tag --sort=-v:refname | grep '^v' | tail -n +3)
          for t in $antigas; do
            git push origin ":refs/tags/$t" || true
          done
